      hints: "[R] Роль &nbsp;│&nbsp; [L] Язык &nbsp;│&nbsp; [T] Тема &nbsp;│&nbsp; [Ctrl+P] Печать → PDF"
    },
    kz: {
      summaryH: "Кәсіби түйіндеме", eduH: "Білім",
      workH: "Жұмыс және тәжірибе", projectsH: "Өз жобаларым (жұмыстан тыс)",
      aiH: "ИИ және автоматтандыру — қалай қолданамын", skillsH: "Техникалық дағдылар",
      softH: "Жұмыс стилім", langH: "Тілдер", objH: "Мақсат",
      hints: "[R] Рөл &nbsp;│&nbsp; [L] Тіл &nbsp;│&nbsp; [T] Тақырып &nbsp;│&nbsp; [Ctrl+P] Басып шығару → PDF"
    },
    en: {
      summaryH: "Professional Summary", eduH: "Education",
      workH: "Employment & Internships", projectsH: "Personal projects (outside work)",
      aiH: "AI & automation — how I use it", skillsH: "Technical Skills",
      softH: "How I work", langH: "Languages", objH: "Career Objective",
      hints: "[R] Role &nbsp;│&nbsp; [L] Lang &nbsp;│&nbsp; [T] Theme &nbsp;│&nbsp; [Ctrl+P] Print → PDF"
    }
  };

  const ROLE_ORDER = ['sysadmin', 'devops', 'developer'];
  const LANGS = ['ru', 'kz', 'en'];
  let currentRole = 'sysadmin';
  let currentLang = 'ru';

  function fileName() {
    const r = ROLES[currentRole].file;
    const l = currentLang.toUpperCase();
    return 'Iskakov_Amir_' + r + '_' + l;
  }

  function renderSkills(skills) {
    const mid = Math.ceil(skills.length / 2);
    const left = skills.slice(0, mid);
    const right = skills.slice(mid);
    const col = arr => '<div class="skills-col">' + arr.map(s =>
      '<div class="skill-line"><span class="prefix">' + s[0] + '</span><span class="label">' + s[1] + '</span><span class="value"> ' + s[2] + '</span></div>'
    ).join('') + '</div>';
    return col(left) + col(right);
  }

  function renderList(items, cls) {
    return items.map(function(job) {
      return '<div class="' + cls + '">' +
        '<div class="work-title">' + job.title + '</div>' +
        '<div class="work-meta"><span class="period">' + job.period + '</span><span class="type">' + job.type + '</span></div>' +
        (job.tech ? '<div class="work-tech">' + job.tech + '</div>' : '') +
        '<ul>' + job.items.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
        '</div>';
    }).join('');
  }

  function renderLang() {
    const base = BASE[currentLang];
    const role = ROLES[currentRole];
    const r = role[currentLang];
    const ui = UI[currentLang];
    const names = { ru: "ИСКАКОВ АМИР", kz: "ИСКАКОВ АМИР", en: "ISKAKOV AMIR" };

    document.getElementById('js-name').textContent = names[currentLang];
    document.getElementById('js-role').textContent = role.label[currentLang];
    document.getElementById('js-subtitle').textContent = r.subtitle;
    document.getElementById('js-summary').textContent = r.summary;
    document.getElementById('js-edu').innerHTML = base.edu;
    document.getElementById('js-work').innerHTML = renderList(base.work, 'work-item');
    document.getElementById('js-projects').innerHTML = renderList(base.projects, 'project-item');
    document.getElementById('js-projects-note').textContent = base.projectsNote;
    document.getElementById('js-ai').innerHTML =
      '<div class="ai-item"><ul>' + r.ai.map(a => '<li>' + a + '</li>').join('') + '</ul></div>';
    document.getElementById('js-skills').innerHTML = renderSkills(r.skills);
    document.getElementById('js-summary-h').textContent = ui.summaryH;
    document.getElementById('js-work-h').textContent = ui.workH;
    document.getElementById('js-projects-h').textContent = ui.projectsH;
    document.getElementById('js-edu-h').textContent = ui.eduH;
    document.getElementById('js-ai-h').textContent = ui.aiH;
    document.getElementById('js-skills-h').textContent = ui.skillsH;
    document.getElementById('js-soft-h').textContent = ui.softH;
    document.getElementById('js-soft').innerHTML = r.soft.map(s => '<li>' + s + '</li>').join('');
    document.getElementById('js-lang-h').textContent = ui.langH;
    document.getElementById('js-lang').innerHTML = base.langList.map(s => '<li>' + s + '</li>').join('');
    document.getElementById('js-obj-h').textContent = ui.objH;
    document.getElementById('js-obj').textContent = r.obj;
    document.getElementById('js-hints').innerHTML = ui.hints;

    // filename for PDF save: browsers use document.title
    document.title = fileName();
    document.documentElement.lang = currentLang;

    // tabs
    document.querySelectorAll('#roleTabs .role-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.role === currentRole));
    document.querySelectorAll('#roleTabs [data-lang]').forEach(t =>
      t.classList.toggle('active', t.dataset.lang === currentLang));

    // deep link
    const url = new URL(window.location.href);
    url.searchParams.set('role', currentRole);
    url.searchParams.set('lang', currentLang);
    window.history.replaceState(null, '', url.toString());
    try {
      localStorage.setItem('cv-role', currentRole);
      localStorage.setItem('cv-lang', currentLang);
    } catch (e) {}
  }

  function setRole(role) {
    if (!ROLES[role]) return;
    currentRole = role;
    renderLang();
  }

  function setLang(lang) {
    if (!BASE[lang]) return;
    currentLang = lang;
    renderLang();
  }

  document.querySelectorAll('.role-tab').forEach(tab => {
    tab.addEventListener('click', function() { setRole(this.dataset.role); });
  });
  document.querySelectorAll('[data-lang]').forEach(tab => {
    tab.addEventListener('click', function() { setLang(this.dataset.lang); });
  });

  function toggleTheme() {
    const t = document.body;
    if (t.classList.contains('light')) {
      t.classList.remove('light');
      t.classList.add('dark');
    } else {
      t.classList.remove('dark');
      t.classList.add('light');
    }
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('dlBtn').addEventListener('click', function() {
    // Ensure title (= filename) is fresh, then print → Save as PDF
    document.title = fileName();
    window.print();
  });

  // init from URL ?role=&lang=, fallback to storage
  (function init() {
    try {
      const q = new URLSearchParams(window.location.search);
      const qr = q.get('role'), ql = q.get('lang');
      if (qr && ROLES[qr]) currentRole = qr;
      else {
        const sr = localStorage.getItem('cv-role');
        if (sr && ROLES[sr]) currentRole = sr;
      }
      if (ql && BASE[ql]) currentLang = ql;
      else {
        const sl = localStorage.getItem('cv-lang');
        if (sl && BASE[sl]) currentLang = sl;
      }
    } catch (e) {}
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.matches) document.body.classList.add('light');
    renderLang();
  })();

  document.addEventListener('keydown', function(e) {
    if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') {
      e.preventDefault(); toggleTheme();
    }
    if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') {
      e.preventDefault();
      setLang(LANGS[(LANGS.indexOf(currentLang) + 1) % LANGS.length]);
    }
    if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
      e.preventDefault();
      setRole(ROLE_ORDER[(ROLE_ORDER.indexOf(currentRole) + 1) % ROLE_ORDER.length]);
    }
  });
</script>

</body>
</html>
